<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tecboard - monitoramento em tempo real com alertas inteligentes.">
    <title>Tecboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <div class="logo">
            <span class="logo-icone">▦</span>
            <span>tecboard</span>
        </div>

        <button id="botaoTema" class="botao-tema" aria-label="Alterar tema">
            Alternar Tema
        </button>
    </header>

    <hr>

    <!-- Conteúdo principal -->
    <main>
        <section class="principal">
            <div class="conteudo">
                <h1>Fique de olho no que importa</h1>

                <p>
                    Monitoramento em tempo real com alertas inteligentes para sua aplicação nunca sair do ar sem você saber.
                </p>

                <button id="botaoDemo" class="botao-demo">
                    Testar versão demo
                </button>
            </div>

            <br>

            <!-- Imagem original dos celulares -->
            <div class="area-imagem">
                <img src="./celular.png" alt="Dois celulares mostrando as telas da aplicação" class="celulares">
            </div>
        </section>
    </main>

    <!-- Mensagem do botão demo -->
    <div id="mensagemDemo" class="mensagem-demo">
        [Versão demo em desenvolvimento]
    </div>

    <script src="script.js"></script>

</body>

</html>
